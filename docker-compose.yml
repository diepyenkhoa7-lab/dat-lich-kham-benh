version: '3.8'

services:
  # ─── MySQL Database ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datlichkhambenh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # ─── Redis Cache ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
