<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - DatLichKhamBenh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🏥</div>
        <h1>Đăng Nhập Hệ Thống</h1>
        <p>Chọn tài khoản hoặc nhập thông tin đăng nhập</p>
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@clinic.vn" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-full mt-2 btn-lg" id="btn-submit">
          Đăng Nhập
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký Bệnh nhân</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error-alert');
      const btn = document.getElementById('btn-submit');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';

      try {
        const res = await Api.auth.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        Auth.setSession(res.data);
        Utils.showToast('Đăng nhập thành công!', 'success');
        setTimeout(() => Auth.redirectByRole(res.data.role), 500);
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Đăng Nhập';
      }
    });
  </script>
</body>
</html>
