<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body><div class="container-fluid"><div class="row">
<aside class="sidebar"><h5 class="text-white mb-4">Quản trị hệ thống</h5><nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Tổng quan</a><a class="nav-link" href="analytics.html">Báo cáo</a><a class="nav-link active" href="users.html">Người dùng</a><a class="nav-link" href="doctors.html">Duyệt bác sĩ</a><a class="nav-link" href="specialties.html">Chuyên khoa</a><a class="nav-link" href="services.html">Dịch vụ</a></nav><button onclick="Auth.logout()" class="btn btn-outline-light mt-auto">Đăng xuất</button></aside>
<main>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><h2 class="fw-bold mb-0">Quản lý người dùng</h2></div>
    <button class="btn btn-primary" onclick="openCreate()"><i class="bi bi-person-plus me-1"></i>Thêm mới</button>
  </div>
  <div class="btn-group mb-4" role="group"><button id="doctor-tab" class="btn btn-primary" onclick="selectType('DOCTOR')">Bác sĩ</button><button id="patient-tab" class="btn btn-outline-primary" onclick="selectType('PATIENT')">Bệnh nhân</button></div>
  <div class="table-responsive"><table class="table align-middle"><thead id="tableHead"></thead><tbody id="userRows"></tbody></table></div>
</main></div></div>

<div class="modal fade" id="user-modal" tabindex="-1"><div class="modal-dialog modal-lg"><form id="userForm" class="modal-content">
  <div class="modal-header"><h5 id="modalTitle" class="modal-title">Thông tin người dùng</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input id="editingId" type="hidden"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Email</label><input id="userEmail" type="email" class="form-control" required></div>
    <div id="passwordField" class="col-md-6"><label class="form-label">Mật khẩu</label><input id="userPassword" type="password" minlength="8" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Họ và tên</label><input id="userName" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Điện thoại</label><input id="userPhone" class="form-control" pattern="[0-9+]{9,15}" required></div>
    <div class="doctor-fields col-md-6"><label class="form-label">Chuyên khoa</label><select id="userSpecialty" class="form-select"></select></div>
    <div class="doctor-fields col-md-6"><label class="form-label">Bằng cấp</label><input id="userDegree" class="form-control"></div>
    <div class="doctor-fields col-md-6"><label class="form-label">Kinh nghiệm (năm)</label><input id="userExperience" type="number" min="0" class="form-control"></div>
    <div class="doctor-fields col-md-6"><label class="form-label">Giá khám</label><input id="userFee" type="number" min="0" class="form-control"></div>
    <div class="patient-fields col-md-4"><label class="form-label">Ngày sinh</label><input id="userDob" type="date" class="form-control"></div>
    <div class="patient-fields col-md-4"><label class="form-label">Giới tính</label><select id="userGender" class="form-select"><option value="MALE">Nam</option><option value="FEMALE">Nữ</option><option value="OTHER">Khác</option></select></div>
    <div class="patient-fields col-md-8"><label class="form-label">Địa chỉ</label><input id="userAddress" class="form-control"></div>
    <div class="patient-fields col-12"><label class="form-label">Tiền sử bệnh</label><textarea id="userHistory" class="form-control" rows="3"></textarea></div>
  </div></div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button><button class="btn btn-primary">Lưu</button></div>
</form></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script>
<script>
Auth.checkAuth(['ADMIN']);
let currentType = 'DOCTOR', records = [], accountMap = new Map(), specialties = [];
const modal = new bootstrap.Modal(document.getElementById('user-modal'));
async function initialize() { specialties = (await Api.admin.specialties()).data || []; userSpecialty.innerHTML = specialties.map(s => `<option value="${s.id}">${s.name}</option>`).join(''); await load(); }
async function load() {
  const [dataResponse, accountResponse] = await Promise.all([currentType === 'DOCTOR' ? Api.admin.doctors() : Api.admin.patients(), Api.admin.users(currentType)]);
  records = dataResponse.data || []; accountMap = new Map((accountResponse.data || []).map(item => [item.id, item])); render();
}
function selectType(type) {
  currentType = type; const doctorTab = document.getElementById('doctor-tab'); const patientTab = document.getElementById('patient-tab');
  doctorTab.className = `btn ${type === 'DOCTOR' ? 'btn-primary' : 'btn-outline-primary'}`;
  patientTab.className = `btn ${type === 'PATIENT' ? 'btn-primary' : 'btn-outline-primary'}`; load();
}
function render() {
  tableHead.innerHTML = currentType === 'DOCTOR' ? '<tr><th>Bác sĩ</th><th>Chuyên khoa</th><th>Giá khám</th><th>Phê duyệt</th><th>Trạng thái</th><th></th></tr>' : '<tr><th>Bệnh nhân</th><th>Điện thoại</th><th>Ngày sinh</th><th>Trạng thái</th><th></th></tr>';
  userRows.innerHTML = records.map(item => { const account = accountMap.get(item.userId) || {}; return currentType === 'DOCTOR' ? `<tr><td><strong>${item.fullName}</strong><div class="small text-muted">${item.email}</div></td><td>${item.specialtyName}</td><td>${Utils.formatCurrency(item.consultationFee)}</td><td><span class="badge ${item.isApproved ? 'bg-success' : 'bg-warning text-dark'}">${item.isApproved ? 'Đã duyệt' : 'Chờ duyệt'}</span></td>${actions(item, account)}</tr>` : `<tr><td><strong>${item.fullName}</strong><div class="small text-muted">${item.email}</div></td><td>${item.phone || ''}</td><td>${item.dob ? Utils.formatDate(item.dob) : ''}</td>${actions(item, account)}</tr>`; }).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">Không có dữ liệu</td></tr>';
}
function actions(item, account) { return `<td><span class="badge ${account.isActive ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${account.isActive ? 'Hoạt động' : 'Đã khóa'}</span></td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="openEdit(${item.userId})"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm ${account.isActive ? 'btn-outline-warning' : 'btn-outline-success'}" onclick="toggleStatus(${item.userId}, ${!account.isActive})"><i class="bi ${account.isActive ? 'bi-lock' : 'bi-unlock'}"></i></button> <button class="btn btn-sm btn-outline-danger" onclick="removeUser(${item.userId})"><i class="bi bi-trash"></i></button></td>`; }
function configureFields() { document.querySelectorAll('.doctor-fields').forEach(el => el.classList.toggle('d-none', currentType !== 'DOCTOR')); document.querySelectorAll('.patient-fields').forEach(el => el.classList.toggle('d-none', currentType !== 'PATIENT')); }
function openCreate() { userForm.reset(); editingId.value = ''; userEmail.disabled = false; userPassword.required = true; passwordField.classList.remove('d-none'); modalTitle.textContent = `Thêm ${currentType === 'DOCTOR' ? 'bác sĩ' : 'bệnh nhân'}`; configureFields(); modal.show(); }
function openEdit(id) { const item = records.find(record => record.userId === id); editingId.value = id; userEmail.value = item.email; userEmail.disabled = true; userPassword.required = false; passwordField.classList.add('d-none'); userName.value = item.fullName || ''; userPhone.value = item.phone || ''; if (currentType === 'DOCTOR') { userSpecialty.value = item.specialtyId; userDegree.value = item.degree || ''; userExperience.value = item.experienceYears ?? 0; userFee.value = item.consultationFee ?? 0; } else { userDob.value = item.dob || ''; userGender.value = item.gender || 'OTHER'; userAddress.value = item.address || ''; userHistory.value = item.medicalHistory || ''; } modalTitle.textContent = 'Cập nhật người dùng'; configureFields(); modal.show(); }
userForm.addEventListener('submit', async event => { event.preventDefault(); const id = editingId.value; try { if (currentType === 'DOCTOR') { const body = {fullName:userName.value,phone:userPhone.value,specialtyId:Number(userSpecialty.value),degree:userDegree.value,experienceYears:Number(userExperience.value),consultationFee:Number(userFee.value)}; if (id) await Api.admin.updateDoctor(id,body); else await Api.admin.createDoctor({...body,email:userEmail.value,password:userPassword.value,approved:true}); } else { const body = {fullName:userName.value,phone:userPhone.value,dob:userDob.value||null,gender:userGender.value,address:userAddress.value,medicalHistory:userHistory.value}; if (id) await Api.admin.updatePatient(id,body); else await Api.admin.createPatient({...body,email:userEmail.value,password:userPassword.value}); } modal.hide(); await load(); Utils.showToast('Đã lưu người dùng','success'); } catch(error) { Utils.showToast(error.message,'danger'); } });
async function toggleStatus(id, active) { try { await Api.admin.setUserStatus(id,active); await load(); } catch(error) { Utils.showToast(error.message,'danger'); } }
async function removeUser(id) { if (!confirm('Xóa tài khoản này? Dữ liệu có lịch sử khám sẽ không được phép xóa.')) return; try { currentType === 'DOCTOR' ? await Api.admin.deleteDoctor(id) : await Api.admin.deletePatient(id); await load(); } catch(error) { Utils.showToast(error.message,'danger'); } }
initialize();
</script></body></html>
