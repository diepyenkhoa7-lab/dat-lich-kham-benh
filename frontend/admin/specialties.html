<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Chuyên Khoa - DatLichKhamBenh</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">⚡</div>
        <span>Quản Trị Viên</span>
      </div>
      <div class="sidebar-section">Menu</div>
      <a href="dashboard.html" class="sidebar-link"><span class="icon">📊</span> Thống Kê Tổng Quan</a>
      <a href="doctors.html" class="sidebar-link"><span class="icon">👨‍⚕️</span> Duyệt Bác Sĩ Mới</a>
      <a href="specialties.html" class="sidebar-link active"><span class="icon">🏥</span> Quản Lý Chuyên Khoa</a>
      
      <div class="sidebar-footer">
        <button onclick="Auth.logout()" class="btn btn-ghost btn-sm w-full">Đăng xuất</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Danh Sách Chuyên Khoa Y Tế</h1>
        <p class="page-subtitle">Xem và tạo mới danh mục chuyên khoa</p>
      </div>

      <div class="grid grid-2 mb-3">
        <div class="card">
          <h3 class="card-title mb-2">➕ Thêm Chuyên Khoa Mới</h3>
          <form id="create-specialty-form">
            <div class="form-group">
              <label class="form-label">Tên Chuyên Khoa</label>
              <input type="text" id="name" class="form-control" placeholder="VD: Da liễu & Thẩm mỹ..." required>
            </div>
            <div class="form-group">
              <label class="form-label">Mô Tả Chuyên Khoa</label>
              <textarea id="description" class="form-control" rows="3" placeholder="Mô tả phạm vi khám và chữa bệnh..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-full">Thêm Chuyên Khoa</button>
          </form>
        </div>

        <div class="card">
          <h3 class="card-title mb-2">📋 Các Chuyên Khoa Hiện Có</h3>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên Chuyên Khoa</th>
                  <th>Mô Tả</th>
                </tr>
              </thead>
              <tbody id="specialties-list">
                <tr><td colspan="3"><div class="spinner"></div> Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    Auth.checkAuth(['ADMIN']);

    async function loadSpecialties() {
      const tbody = document.getElementById('specialties-list');
      try {
        const res = await Api.admin.specialties();
        const list = res.data || [];

        tbody.innerHTML = list.map(item => `
          <tr>
            <td><strong>#${item.id}</strong></td>
            <td class="text-accent"><strong>${item.name}</strong></td>
            <td>${item.description || '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-error p-3">${err.message}</td></tr>`;
      }
    }

    document.getElementById('create-specialty-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await Api.admin.createSpecialty({
          name: document.getElementById('name').value,
          description: document.getElementById('description').value
        });
        Utils.showToast('Thêm chuyên khoa mới thành công!', 'success');
        document.getElementById('create-specialty-form').reset();
        loadSpecialties();
      } catch (err) {
        Utils.showToast(err.message, 'error');
      }
    });

    loadSpecialties();
  </script>
</body>
</html>
