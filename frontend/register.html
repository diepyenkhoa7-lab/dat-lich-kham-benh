<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký - DatLichKhamBenh</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" style="max-width:540px;">
      <div class="auth-logo">
        <div class="logo-icon">📝</div>
        <h1>Tạo Tài Khoản Mới</h1>
        <p>Đăng ký tài khoản để bắt đầu đặt lịch khám bệnh</p>
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Loại Tài Khoản</label>
          <select id="role" class="form-control" onchange="onRoleChange(this.value)">
            <option value="PATIENT">Bệnh nhân (Đăng ký tự do)</option>
            <option value="DOCTOR">Bác sĩ (Cần Admin phê duyệt)</option>
          </select>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="user@gmail.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Họ và Tên</label>
          <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" id="phone" class="form-control" placeholder="0912345678" required>
          </div>

          <!-- Patient Fields -->
          <div class="form-group patient-field">
            <label class="form-label">Ngày sinh</label>
            <input type="date" id="dob" class="form-control">
          </div>
        </div>

        <div class="grid grid-2 patient-field">
          <div class="form-group">
            <label class="form-label">Giới tính</label>
            <select id="gender" class="form-control">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Địa chỉ</label>
            <input type="text" id="address" class="form-control" placeholder="Số nhà, Đường, Quận/Huyện">
          </div>
        </div>

        <!-- Doctor Fields -->
        <div class="doctor-field hidden">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Mã chuyên khoa (ID)</label>
              <input type="number" id="specialtyId" class="form-control" placeholder="1" value="1">
            </div>
            <div class="form-group">
              <label class="form-label">Bằng cấp / Học vị</label>
              <input type="text" id="degree" class="form-control" placeholder="Bác sĩ CKI, Thạc sĩ...">
            </div>
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Số năm kinh nghiệm</label>
              <input type="number" id="experienceYears" class="form-control" placeholder="5" value="5">
            </div>
            <div class="form-group">
              <label class="form-label">Giá khám (VNĐ)</label>
              <input type="number" id="consultationFee" class="form-control" placeholder="200000" value="200000">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2 btn-lg" id="btn-submit">
          Tạo Tài Khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function onRoleChange(role) {
      document.querySelectorAll('.patient-field').forEach(el => el.classList.toggle('hidden', role !== 'PATIENT'));
      document.querySelectorAll('.doctor-field').forEach(el => el.classList.toggle('hidden', role !== 'DOCTOR'));
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const errBox = document.getElementById('error-alert');
      const btn = document.getElementById('btn-submit');
      errBox.classList.add('hidden');
      btn.disabled = true;

      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: role,
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
      };

      if (role === 'PATIENT') {
        body.dob = document.getElementById('dob').value;
        body.gender = document.getElementById('gender').value;
        body.address = document.getElementById('address').value;
      } else {
        body.specialtyId = parseInt(document.getElementById('specialtyId').value);
        body.degree = document.getElementById('degree').value;
        body.experienceYears = parseInt(document.getElementById('experienceYears').value);
        body.consultationFee = parseFloat(document.getElementById('consultationFee').value);
      }

      try {
        await Api.auth.register(body);
        alert('Đăng ký thành công! Hãy đăng nhập để tiếp tục.');
        window.location.href = 'login.html';
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
