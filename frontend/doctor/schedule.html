<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Lịch - DatLichKhamBenh</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">👨‍⚕️</div>
        <span>Bác Sĩ</span>
      </div>
      <div class="sidebar-section">Menu</div>
      <a href="dashboard.html" class="sidebar-link"><span class="icon">📋</span> Lịch Khám Bệnh Nhân</a>
      <a href="schedule.html" class="sidebar-link active"><span class="icon">⏰</span> Quản Lý Ca Khám</a>
      
      <div class="sidebar-footer">
        <button onclick="Auth.logout()" class="btn btn-ghost btn-sm w-full">Đăng xuất</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Quản Lý Ca Làm Việc (Slots)</h1>
        <p class="page-subtitle">Tạo và bật/tắt khung giờ nhận bệnh nhân khám</p>
      </div>

      <div class="card mb-3" style="max-width:600px;">
        <h3 class="card-title mb-2">➕ Tạo Khung Giờ Khám Mới</h3>
        <form id="create-slot-form">
          <div class="form-group">
            <label class="form-label">Ngày làm việc</label>
            <input type="date" id="workDate" class="form-control" required>
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Giờ bắt đầu</label>
              <input type="time" id="startTime" class="form-control" value="08:00" required>
            </div>
            <div class="form-group">
              <label class="form-label">Giờ kết thúc</label>
              <input type="time" id="endTime" class="form-control" value="08:30" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-full">Tạo Slot Khám</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    Auth.checkAuth(['DOCTOR']);

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('workDate').value = tomorrow.toISOString().split('T')[0];

    document.getElementById('create-slot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await Api.doctors.createSlot({
          workDate: document.getElementById('workDate').value,
          startTime: document.getElementById('startTime').value + ':00',
          endTime: document.getElementById('endTime').value + ':00'
        });
        Utils.showToast('Tạo ca khám thành công!', 'success');
      } catch (err) {
        Utils.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
