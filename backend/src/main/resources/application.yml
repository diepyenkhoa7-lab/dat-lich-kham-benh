# =====================================================================
# application.yml — DatLichKhamBenh Backend
# Tất cả credential nhạy cảm để dạng placeholder ${ENV_VAR:default}
# KHÔNG hardcode password / secret vào file này.
# =====================================================================

spring:
  application:
    name: datlichkhambenh-backend

  # ─── PostgreSQL ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/datlichkhambenh?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ─────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}   # production: validate; dev: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ─── Redis ───────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ─── Mail (Async Email Notification) ─────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ─── Async (dùng cho AsyncEmailNotificationService) ──────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: async-email-

# ─── Server ──────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# ─── JWT ─────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_AT_LEAST_256BIT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}      # 24 hours default
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

  # ─── Redis Cache TTL (seconds) ───────────────────────────────────
  cache:
    doctor-list-ttl: ${CACHE_DOCTOR_LIST_TTL:300}       # 5 minutes
    available-slots-ttl: ${CACHE_AVAILABLE_SLOTS_TTL:60} # 1 minute

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.datlichkhambenh: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
