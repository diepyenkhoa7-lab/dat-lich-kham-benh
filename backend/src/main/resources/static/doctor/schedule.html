<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý ca làm việc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body><div class="container-fluid"><div class="row">
<aside class="sidebar">
  <h5 class="text-white mb-4"><i class="bi bi-heart-pulse me-2"></i>Bác sĩ</h5>
  <nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Lịch khám</a><a class="nav-link active" href="schedule.html">Ca làm việc</a><a class="nav-link" href="profile.html">Hồ sơ cá nhân</a></nav>
  <button onclick="Auth.logout()" class="btn btn-outline-light mt-auto">Đăng xuất</button>
</aside>
<main>
  <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold mb-0">Ca làm việc</h2></div>
  <section class="mb-5">
    <form id="slot-form" class="row g-3 align-items-end">
      <div class="col-md-4"><label class="form-label">Ngày làm việc</label><input type="date" id="workDate" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Bắt đầu</label><input type="time" id="startTime" value="08:00" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Kết thúc</label><input type="time" id="endTime" value="08:30" class="form-control" required></div>
      <div class="col-md-2"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Tạo ca</button></div>
    </form>
  </section>
  <section>
    <div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0">Lịch sắp tới</h5><button class="btn btn-outline-secondary btn-sm" onclick="loadSlots()"><i class="bi bi-arrow-clockwise"></i></button></div>
    <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Ngày</th><th>Thời gian</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody id="slot-rows"></tbody></table></div>
  </section>
</main></div></div>
<script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script>
<script>
Auth.checkAuth(['DOCTOR']);
const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
workDate.min = tomorrow.toISOString().slice(0,10); workDate.value = workDate.min;
async function loadSlots() {
  try {
    const slots = (await Api.doctors.mySlots()).data || [];
    document.getElementById('slot-rows').innerHTML = slots.map(slot => `<tr>
      <td class="fw-semibold">${Utils.formatDate(slot.workDate)}</td>
      <td>${Utils.formatTime(slot.startTime)} - ${Utils.formatTime(slot.endTime)}</td>
      <td><span class="badge ${slot.isAvailable ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'}">${slot.isAvailable ? 'Đang mở' : slot.isBooked ? 'Đã đặt' : 'Đã tắt'}</span></td>
      <td class="text-end">${slot.isBooked ? '' : `<button class="btn btn-sm ${slot.isAvailable ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleSlot(${slot.id}, ${!slot.isAvailable})">${slot.isAvailable ? 'Tắt' : 'Bật'}</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">Chưa có ca làm việc sắp tới</td></tr>';
  } catch (error) { Utils.showToast(error.message, 'danger'); }
}
async function toggleSlot(id, available) {
  try { await Api.doctors.toggleSlot(id, available); await loadSlots(); }
  catch (error) { Utils.showToast(error.message, 'danger'); }
}
document.getElementById('slot-form').addEventListener('submit', async event => {
  event.preventDefault();
  try {
    await Api.doctors.createSlot({workDate: workDate.value, startTime: startTime.value, endTime: endTime.value});
    Utils.showToast('Đã tạo ca khám', 'success'); await loadSlots();
  } catch (error) { Utils.showToast(error.message, 'danger'); }
});
loadSlots();
</script></body></html>
