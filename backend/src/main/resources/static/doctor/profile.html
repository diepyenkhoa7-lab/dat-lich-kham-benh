<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hồ sơ bác sĩ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body><div class="container-fluid"><div class="row">
<aside class="sidebar">
  <h5 class="text-white mb-4"><i class="bi bi-heart-pulse me-2"></i>Bác sĩ</h5>
  <nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Lịch khám</a><a class="nav-link" href="schedule.html">Ca làm việc</a><a class="nav-link active" href="profile.html">Hồ sơ cá nhân</a></nav>
  <button onclick="Auth.logout()" class="btn btn-outline-light mt-auto">Đăng xuất</button>
</aside>
<main>
  <div class="mb-4"><h2 class="fw-bold">Hồ sơ bác sĩ</h2></div>
  <form id="doctor-form" class="card p-4"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Họ và tên</label><input id="fullName" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input id="email" class="form-control" disabled></div>
    <div class="col-md-6"><label class="form-label">Điện thoại</label><input id="phone" class="form-control" pattern="[0-9+]{9,15}" required></div>
    <div class="col-md-6"><label class="form-label">Chuyên khoa</label><select id="specialtyId" class="form-select" required></select></div>
    <div class="col-md-6"><label class="form-label">Bằng cấp / Học vị</label><input id="degree" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">Kinh nghiệm (năm)</label><input id="experienceYears" type="number" min="0" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Giá khám</label><input id="consultationFee" type="number" min="0" class="form-control" required></div>
  </div><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Lưu thay đổi</button></div></form>
</main></div></div>
<script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script>
<script>
Auth.checkAuth(['DOCTOR']);
async function load() {
  const [profileResponse, specialtyResponse] = await Promise.all([Api.doctors.profile(), Api.doctors.specialties()]);
  const profile = profileResponse.data;
  specialtyId.innerHTML = (specialtyResponse.data || []).map(item => `<option value="${item.id}">${item.name}</option>`).join('');
  ['fullName','email','phone','degree','experienceYears','consultationFee','specialtyId']
    .forEach(key => document.getElementById(key).value = profile[key] ?? '');
}
const doctorForm = document.getElementById('doctor-form');
doctorForm.addEventListener('submit', async event => {
  event.preventDefault();
  try {
    await Api.doctors.updateProfile({fullName: fullName.value, phone: phone.value, degree: degree.value,
      experienceYears: Number(experienceYears.value), consultationFee: Number(consultationFee.value),
      specialtyId: Number(specialtyId.value)});
    Utils.showToast('Đã cập nhật hồ sơ bác sĩ', 'success');
  } catch (error) { Utils.showToast(error.message, 'danger'); }
});
load();
</script></body></html>
