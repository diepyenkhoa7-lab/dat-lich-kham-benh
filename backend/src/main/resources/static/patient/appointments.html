<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Hẹn Của Tôi - DatLichKhamBenh</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">⚡</div>
        <span>Bệnh Nhân</span>
      </div>
      <div class="sidebar-section">Menu</div>
      <a href="/patient/dashboard.html" class="sidebar-link"><span class="icon">🏠</span> Đặt Lịch Khám</a>
      <a href="/patient/appointments.html" class="sidebar-link active"><span class="icon">📅</span> Lịch Hẹn Của Tôi</a>
      <a href="/patient/doctors.html" class="sidebar-link"><span class="icon">👨‍⚕️</span> Danh Sách Bác Sĩ</a>
      
      <div class="sidebar-footer">
        <button onclick="Auth.logout()" class="btn btn-ghost btn-sm w-full">Đăng xuất</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Danh Sách Lịch Hẹn Khám</h1>
        <p class="page-subtitle">Quản lý và theo dõi lịch sử đặt khám của bạn</p>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Mã Lịch Hẹn</th>
                <th>Bác Sĩ Khám</th>
                <th>Chuyên Khoa</th>
                <th>Ngày & Giờ</th>
                <th>Triệu Chứng</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody id="appointments-list">
              <tr><td colspan="7"><div class="spinner"></div> Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    Auth.checkAuth(['PATIENT']);

    async function loadAppointments() {
      const tbody = document.getElementById('appointments-list');
      try {
        const res = await Api.appointments.mine();
        const list = res.data || [];

        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-3">Chưa có lịch hẹn nào.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(item => `
          <tr>
            <td><strong>#${item.bookingCode}</strong></td>
            <td><strong>${item.doctorName}</strong></td>
            <td>${item.specialtyName || '-'}</td>
            <td>${Utils.formatDate(item.appointmentDate)} (${Utils.formatTime(item.startTime)} - ${Utils.formatTime(item.endTime)})</td>
            <td>${item.symptoms || '-'}</td>
            <td>${Utils.getStatusBadge(item.status)}</td>
            <td>
              ${item.status === 'CONFIRMED' ? `
                <button onclick="cancelAppointment(${item.id})" class="btn btn-danger btn-sm">Hủy Lịch</button>
              ` : '-'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-error p-3">${err.message}</td></tr>`;
      }
    }

    async function cancelAppointment(id) {
      if (!confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?')) return;
      try {
        await Api.appointments.cancel(id);
        Utils.showToast('Đã hủy lịch hẹn thành công', 'info');
        loadAppointments();
      } catch (err) {
        Utils.showToast(err.message, 'error');
      }
    }

    loadAppointments();
  </script>
</body>
</html>
