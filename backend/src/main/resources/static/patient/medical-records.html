<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ bệnh án</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container-fluid"><div class="row"><aside class="sidebar"><h5 class="text-white mb-4"><i class="bi bi-heart-pulse me-2"></i>Bệnh nhân</h5><nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Tìm bác sĩ</a><a class="nav-link" href="appointments.html">Lịch hẹn</a><a class="nav-link active" href="medical-records.html">Hồ sơ bệnh án</a><a class="nav-link" href="profile.html">Thông tin cá nhân</a></nav></aside><main><h2 class="fw-bold">Lịch sử khám bệnh</h2><p class="text-muted mb-4">Chẩn đoán và chỉ dẫn sau mỗi lần khám.</p><div id="list" class="row g-3"></div></main></div></div><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script>Auth.checkAuth(['PATIENT']);(async()=>{try{const a=(await Api.patient.medicalRecords()).data;list.innerHTML=a.map(x=>`<div class="col-12"><article class="card p-4"><div class="d-flex justify-content-between"><h5 class="fw-bold">${x.diagnosis||'Kết quả khám'}</h5><span class="badge bg-success-subtle text-success">${Utils.formatDate(x.createdAt)}</span></div><p class="text-muted mb-0">${x.doctorNotes||'Không có ghi chú.'}</p></article></div>`).join('')||'<div class="card p-5 text-center text-muted">Bạn chưa có hồ sơ bệnh án.</div>'}catch(e){Utils.showToast(e.message,'danger')}})();</script></body></html>
