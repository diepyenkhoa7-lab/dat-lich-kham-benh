<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo cáo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<div class="container-fluid"><div class="row"><aside class="sidebar"><h5 class="text-white mb-4">Quản trị hệ thống</h5><nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Tổng quan</a><a class="nav-link active" href="analytics.html">Báo cáo</a><a class="nav-link" href="users.html">Người dùng</a><a class="nav-link" href="doctors.html">Duyệt bác sĩ</a><a class="nav-link" href="specialties.html">Chuyên khoa</a><a class="nav-link" href="services.html">Dịch vụ</a></nav></aside><main>
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold mb-0">Báo cáo hoạt động</h2><select id="reportYear" class="form-select w-auto"></select></div>
<div class="row g-3 mb-4"><div class="col-md"><div class="card p-3"><small class="text-muted">Tổng lịch hẹn</small><strong id="totalApps" class="fs-3"></strong></div></div><div class="col-md"><div class="card p-3"><small class="text-muted">Đã xác nhận</small><strong id="confirmed" class="fs-3 text-primary"></strong></div></div><div class="col-md"><div class="card p-3"><small class="text-muted">Hoàn thành</small><strong id="completed" class="fs-3 text-success"></strong></div></div><div class="col-md"><div class="card p-3"><small class="text-muted">Đã hủy</small><strong id="cancelled" class="fs-3 text-danger"></strong></div></div><div class="col-md"><div class="card p-3"><small class="text-muted">Doanh thu thực</small><strong id="totalRevenue" class="fs-5 text-success"></strong></div></div></div>
<section class="mb-5"><canvas id="monthlyChart" height="90"></canvas></section>
<section class="mb-5"><h5 class="fw-bold mb-3">Doanh thu theo ngày</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Ngày</th><th>Doanh thu hoàn thành</th></tr></thead><tbody id="dailyRows"></tbody></table></div></section>
<section><h5 class="fw-bold mb-3">Hiệu suất theo bác sĩ</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Bác sĩ</th><th>Chuyên khoa</th><th>Xác nhận</th><th>Hoàn thành</th><th>Đã hủy</th><th>Doanh thu</th></tr></thead><tbody id="rankingRows"></tbody></table></div></section>
</main></div></div><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script>
Auth.checkAuth(['ADMIN']); let chart; const currentYear=new Date().getFullYear(); for(let y=currentYear;y>=currentYear-4;y--) reportYear.innerHTML+=`<option>${y}</option>`;
async function load(){try{const data=(await Api.admin.analytics(reportYear.value)).data;totalApps.textContent=data.yearAppointments;confirmed.textContent=data.statusCounts.CONFIRMED;completed.textContent=data.statusCounts.COMPLETED;cancelled.textContent=data.statusCounts.CANCELLED;totalRevenue.textContent=Utils.formatCurrency(data.yearRevenue);if(chart)chart.destroy();chart=new Chart(document.getElementById('monthlyChart'),{data:{labels:data.months.map(x=>`T${x.month}`),datasets:[{type:'bar',label:'Doanh thu',data:data.months.map(x=>x.revenue),backgroundColor:'#176bdf'},{type:'line',label:'Lịch hẹn',data:data.months.map(x=>x.appointments),borderColor:'#159a68',yAxisID:'y1'}]},options:{responsive:true,scales:{y:{beginAtZero:true},y1:{beginAtZero:true,position:'right',grid:{display:false}}}}});dailyRows.innerHTML=(data.dailyRevenue||[]).map(x=>`<tr><td>${Utils.formatDate(x.date)}</td><td class="text-success fw-semibold">${Utils.formatCurrency(x.revenue)}</td></tr>`).join('')||'<tr><td colspan="2" class="text-center text-muted py-4">Chưa có doanh thu hoàn thành</td></tr>';rankingRows.innerHTML=data.doctorRankings.map(x=>`<tr><td class="fw-semibold">${x.doctorName}</td><td>${x.specialty}</td><td>${x.confirmed}</td><td>${x.completed}</td><td>${x.cancelled}</td><td class="text-success fw-semibold">${Utils.formatCurrency(x.revenue)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-muted py-4">Chưa có dữ liệu</td></tr>';}catch(error){Utils.showToast(error.message,'danger')}} reportYear.addEventListener('change',load);load();
</script></body></html>
